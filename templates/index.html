
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Source Recovery</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:#f1f5f9;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.container{width:100%;max-width:540px}
.card{
 background:#151d32;border:1px solid #293650;
 border-radius:22px;padding:25px;
 box-shadow:0 20px 60px #0005
}
.logo{text-align:center;font-size:45px}
h1{text-align:center;font-size:24px}
.desc{text-align:center;color:#aab6ca;line-height:1.8}
label{display:block;margin:18px 0 8px}
input[type=password],input[type=file]{
 width:100%;padding:14px;border-radius:12px;
 border:1px solid #394967;background:#0c1426;
 color:white
}
button,.download{
 display:block;width:100%;padding:15px;border:0;
 border-radius:12px;background:#16a978;color:white;
 font-size:16px;font-weight:bold;text-align:center;
 cursor:pointer;margin-top:15px;text-decoration:none
}
button:disabled{opacity:.5}
.progress{
 height:12px;background:#28354b;border-radius:20px;
 overflow:hidden;margin:18px 0
}
#bar{height:100%;width:0;background:#20d69a;transition:.3s}
#result{display:none;margin-top:20px}
#message{text-align:center;color:#b8c6d9;line-height:1.8}
.note{font-size:12px;color:#9aa9c0;line-height:1.8}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="card">
 <div class="logo">📦</div>
 <h1>APK Source Recovery</h1>
 <p class="desc">
 استعادة ملفات التطبيقات وتحليل الشفرة والموارد
 وتجهيز مشروع Android قابل للتطوير.
 </p>

 <form id="form">
  <label>كلمة مرور لوحة التحليل</label>
  <input type="password" name="password"
         placeholder="كلمة مرور الإدارة" required>

  <label>اختر ملف APK</label>
  <input type="file" name="apk" accept=".apk"
         required>

  <button id="start">بدء التحليل</button>
 </form>

 <div id="result">
  <div class="progress"><div id="bar"></div></div>
  <p id="percent" style="text-align:center">0%</p>
  <p id="message">بانتظار بدء التحليل...</p>
  <a id="download" class="download hidden">⬇ تنزيل المشروع ZIP</a>
 </div>

 <p class="note">
 يدعم استخراج الموارد والشفرة المفككة. لا يضمن استعادة
 الشفرة الأصلية أو بناء APK دون تعديلات إضافية.
 لا ترفع تطبيقات لا تملك حق تحليلها.
 </p>
</div>
</div>

<script>
const form = document.getElementById("form");
const start = document.getElementById("start");
const result = document.getElementById("result");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const message = document.getElementById("message");
const download = document.getElementById("download");

form.addEventListener("submit", async e => {
 e.preventDefault();

 start.disabled = true;
 start.textContent = "جارٍ رفع الملف...";
 result.style.display = "block";
 download.classList.add("hidden");

 try {
  const response = await fetch("/upload", {
   method:"POST",
   body:new FormData(form)
  });

  const data = await response.json();

  if(!response.ok) throw new Error(data.error || "فشل الرفع");

  message.textContent = "تم رفع APK، بدأ التحليل...";
  poll(data.job_id);

 } catch(error) {
  message.textContent = error.message;
  start.disabled = false;
  start.textContent = "إعادة المحاولة";
 }
});

async function poll(id) {
 try {
  const response = await fetch("/status/" + id);
  const data = await response.json();

  if(!response.ok) throw new Error(data.error || "تعذر قراءة الحالة");

  bar.style.width = data.progress + "%";
  percent.textContent = data.progress + "%";
  message.textContent = data.message;

  if(data.status === "completed") {
   download.href = "/download/" + id;
   download.classList.remove("hidden");
   start.disabled = false;
   start.textContent = "تحليل APK آخر";
   return;
  }

  if(data.status === "error") {
   start.disabled = false;
   start.textContent = "إعادة المحاولة";
   return;
  }

  setTimeout(() => poll(id), 2000);

 } catch(error) {
  message.textContent = error.message;
  start.disabled = false;
  start.textContent = "إعادة المحاولة";
 }
}
</script>
</body>
</html>
