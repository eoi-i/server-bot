<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>تفاصيل التحليل</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">APK</span><span><b>APK Analyzer</b><small>تفاصيل المهمة</small></span></a><nav><a href="/history">السجل</a><a href="/donate" class="nav-donate">تبرع · £10</a></nav></header><section class="panel detail-panel"><span class="eyebrow">تفاصيل التحليل</span><h1 id="filename">{{ analysis.filename }}</h1><div class="progress-head"><b id="status">{{ analysis.status }}</b><span id="percent">{{ analysis.progress or 0 }}%</span></div><div class="progress-track"><i id="bar" style="width:{{ analysis.progress or 0 }}%"></i></div><p id="message" class="detail-message">{{ analysis.message }}</p><div class="detail-actions"><a id="download" class="button primary {% if analysis.status != 'completed' %}hidden{% endif %}" href="{{ url_for('download', job_id=analysis.id) }}">تنزيل ZIP</a><button id="cancel" class="button danger {% if analysis.status not in ['queued','processing'] %}hidden{% endif %}">إلغاء المهمة</button><a class="button secondary" href="/history">سجل التحليلات</a></div></section><footer><a href="/">الرئيسية</a></footer></main><script>
const id={{ analysis.id|tojson }}, token=document.querySelector('meta[name=csrf-token]').content;let done=false;async function refresh(){if(done)return;try{const r=await fetch('/api/status/'+id,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#status').textContent=d.status;document.querySelector('#percent').textContent=(d.progress||0)+'%';document.querySelector('#bar').style.width=(d.progress||0)+'%';document.querySelector('#message').textContent=d.message||'';if(d.status==='completed'){document.querySelector('#download').classList.remove('hidden');document.querySelector('#cancel').classList.add('hidden');done=true}if(['failed','cancelled'].includes(d.status)){document.querySelector('#cancel').classList.add('hidden');done=true}}catch(e){document.querySelector('#message').textContent='تعذر تحديث حالة المهمة مؤقتاً.'}}document.querySelector('#cancel').addEventListener('click',async()=>{if(!confirm('هل تريد إلغاء هذه المهمة؟'))return;const r=await fetch('/api/cancel/'+id,{method:'POST',headers:{'X-CSRFToken':token}});const d=await r.json();if(!r.ok)alert(d.error||'تعذر الإلغاء');refresh()});refresh();setInterval(refresh,2500);
</script></body></html>
