<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل التحليلات</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-icon">APK</span><span><b>APK Analyzer</b><small>سجل التحليلات</small></span></a><nav><a href="/">الرئيسية</a><a href="/donate" class="nav-donate">ادعم المشروع · £10</a></nav></header><section class="panel"><span class="eyebrow">لوحة التحكم</span><h1>سجل التحليلات</h1><div class="history-list">{% for item in history %}<a class="history-row" href="/analysis/{{ item.id }}"><span class="file-badge">APK</span><span class="history-name"><b>{{ item.filename }}</b><small>{{ item.message }}</small></span><span class="status-pill status-{{ item.status }}">{{ item.status }}</span><span class="row-progress">{{ item.progress or 0 }}%</span></a>{% else %}<p class="empty">السجل فارغ حالياً.</p>{% endfor %}</div></section><footer><a href="/">العودة للرئيسية</a></footer></main></body></html>
