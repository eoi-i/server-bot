app = "server-bot-w3jeua"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/tmp/apk-analyzer-data"
  MAX_UPLOAD_BYTES = "104857600"
  MAX_ANALYSIS_SECONDS = "7200"
  MAX_JADX_DEX = "12"
  MAX_WORKERS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
