# fly.toml app configuration file generated for server-bot-w3jeua on 2026-11-04T10:44:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'server-bot-w3jeua'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_PATH = '/data/bot.db'
  LOG_LEVEL = 'INFO'
  PORT = '8080'

[[mounts]]
  source = 'bot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
